# WS4 even-flow targets — S7 even-flow, UWR no-harvest
#
# Horizon 200 years in 10-year periods (20 periods).
# Harvest floor     : product.HarvestedVolume.managed.Total.CC >= 3,000,000 m3 per period (soft upward pull)
# Even-flow band    : every period within +/-5% of the reference period (the last)
# No ending-inventory floor. The shape constraint is an even-flow harvest band of +/-5%.
# Prio 2 = even-flow shape with a high weight; the harvest floor is a soft level guide.
#
# The 3,000,000 floor is a soft upward pull, NOT the answer. `scripts/max_flow.py`
# replaces the harvest floors with a binary search for the highest feasible constant
# level and keeps every other target here unchanged.
#
# Caribou layer: UWR u-3-005 no-harvest. This target file cannot express a block
# exclusion; it needs the UWR-restricted dataset (build/compiled_uwr). See plan.txt.

targets:
  - {account: product.HarvestedVolume.managed.Total.CC, period: 1, period_width: 10, flow: even, minimum: -5, maximum: 5, min_weight: 10000, max_weight: 10000, shape: non_linear, flow_reference_period: 1, priority: 2}
  - {account: product.HarvestedVolume.managed.Total.CC, period: 1, period_width: 10, minimum: 3000000, min_weight: 0.1, shape: linear, priority: 2}
