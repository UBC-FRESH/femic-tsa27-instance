# WS4 even-flow targets — S7 even-flow, UWR no-harvest
#
# Horizon 200 years in 10-year periods (20 periods).
# Harvest floor     : product.HarvestedVolume.managed.Total.CC >= 1,900,000 m3 per period (starting probe)
# Even-flow band    : every period within +/-1% of the reference period (the last)
# Growing-stock floor: feature.Yield.managed.Total >= 24,218,812 m3 at the end of every period
#                      (= current growing stock on the 79,102 ha THLB, offset -1)
# Prio 1 = growing stock (hard), prio 2 = harvest level and shape.
#
# The 1,900,000 floor is a starting probe, NOT the answer. `scripts/max_flow.py`
# replaces the harvest floors with a binary search for the highest feasible constant
# level and keeps every other target here unchanged.
#
# Caribou layer: UWR u-3-005 no-harvest. This target file cannot express a block
# exclusion; it needs the UWR-restricted dataset (build/compiled_uwr). See plan.txt.

