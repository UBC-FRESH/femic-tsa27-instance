# Tool configuration for the UBC-FRESH dev workflow. This repository is a seed and
# documentation kit, not a Python package, so there is no [project] table. Each gate
# configured here is also a check in the green dashboard (scripts/dashboard.py).

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["scripts", "tests"]
extend-exclude = ["tmp", "_build"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "D", "ANN", "N", "PT", "SIM", "RUF", "C4"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]
"templates/project/tests/**" = ["D"]
"docs/conf.py" = ["D", "ANN", "N"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
mypy_path = "scripts"
files = ["scripts", "tests", "docs/conf.py"]

[[tool.mypy.overrides]]
module = ["numpydoc", "numpydoc.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["geopandas", "geopandas.*", "shapely", "shapely.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=scripts --cov-branch --cov-report=term-missing --cov-fail-under=95"

[tool.coverage.run]
branch = true
source = ["scripts"]
# Operational analysis pipelines are validated by their reports and run artifacts, not by the
# framework coverage gate. The framework scripts remain at the 95% branch-coverage target.
omit = [
    "scripts/build_annual_snapshots.py",
    "scripts/build_nested_public_scenarios.py",
    "scripts/build_oldest_first_seed.py",
    "scripts/build_operational_pilot.py",
    "scripts/build_operational_screen.py",
    "scripts/build_public_data_envelope.py",
    "scripts/build_shared_road_costs.py",
    "scripts/build_uwr_timing.py",
    "scripts/build_ws4_route_all.py",
    "scripts/build_ws4_route_distances.py",
    "scripts/build_ws4_route_truck.py",
    "scripts/build_year_by_year_screen.py",
    "scripts/fetch_annual_snapshot_layers.py",
    "scripts/fetch_bc_interior_amv.py",
    "scripts/fetch_price_index.py",
]

[tool.coverage.report]
show_missing = true
exclude_also = ['if __name__ == "__main__":']
